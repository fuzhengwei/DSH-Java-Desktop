[package]
name = "dsh-java-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_java_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
rfd = "0.15"
