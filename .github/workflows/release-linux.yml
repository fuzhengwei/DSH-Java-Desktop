name: Release Linux x64

on:
  push:
    tags:
      - 'linux-x64-v*'
  workflow_dispatch:

jobs:
  release:
    name: Linux x64
    uses: ./.github/workflows/build-desktop.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      platform: linux
      runner: ubuntu-latest
      target: x86_64-unknown-linux-gnu
      runtime-target: linux-x64
      release-tag-prefix: dsh-java-desktop-v
