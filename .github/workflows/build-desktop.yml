name: Build Desktop

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      runtime-target:
        required: true
        type: string
      release-tag-prefix:
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Install Linux build dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # bundled JRE 的 JNI 库（如 libprefs.so）依赖 libjvm.so，它位于 JRE 自带的
      # lib/server/ 目录，不在系统库路径上。linuxdeploy 解析 AppDir 内所有 ELF
      # 的依赖时找不到它会导致 AppImage 打包失败（ERROR: Could not find dependency: libjvm.so）。
      # 把构建用 JDK 的 libjvm.so 软链进系统库目录，让 linuxdeploy 能解析到。
      # AppImage 运行时 JRE 的 lib/server/ 已随资源打包，java 进程自己能找到 libjvm.so，
      # 因此 linuxdeploy 只是把 libjvm.so 复制进 AppDir 也无副作用（体积 +~20MB）。
      - name: Make libjvm discoverable for linuxdeploy (Linux AppImage)
        if: inputs.platform == 'linux'
        run: |
          set -euo pipefail
          JAVA_LIBJVM="${JAVA_HOME}/lib/server/libjvm.so"
          if [ ! -f "${JAVA_LIBJVM}" ]; then
            # setup-java 的 JAVA_HOME 在部分 runner 镜像上指向 JRE，JNI 库在不同位置
            JAVA_LIBJVM="$(find /usr/lib/jvm -name libjvm.so -path '*server*' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "${JAVA_LIBJVM}" ] || [ ! -f "${JAVA_LIBJVM}" ]; then
            sudo apt-get install -y openjdk-17-jdk-headless
            JAVA_LIBJVM="$(find /usr/lib/jvm -name libjvm.so -path '*server*' 2>/dev/null | head -1)"
          fi
          echo "Linking ${JAVA_LIBJVM} -> /usr/lib/x86_64-linux-gnu/libjvm.so"
          sudo ln -sf "${JAVA_LIBJVM}" /usr/lib/x86_64-linux-gnu/libjvm.so

      - name: Install dependencies
        run: npm ci

      - name: Setup macOS signing and notarization
        if: inputs.platform == 'macos'
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          (echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > certificate.p12) || (echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 -D > certificate.p12)
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "\".*\"" || (echo "No valid codesigning identity found." && exit 1)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "${{ secrets.APPLE_SIGNING_IDENTITY }}" || (echo "APPLE_SIGNING_IDENTITY not found." && exit 1)

      - name: Verify bundled agent JAR
        run: npm run agent:verify

      - name: Prepare bundled Java runtime
        env:
          DSH_JRE_TARGET: ${{ inputs.runtime-target }}
        run: npm run agent:runtime

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release-tag-prefix }}__VERSION__
          releaseName: 'DSH Java Desktop v__VERSION__'
          releaseBody: 'This release bundles the DeepSeek Harness Java runtime and updater artifacts.'
          releaseDraft: false
          prerelease: false
          args: '--target ${{ inputs.target }} --verbose'
